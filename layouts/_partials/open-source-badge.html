{{- $repo := .Site.Params.github_repo | default "https://github.com/polla-fattah/frontend-book" -}}
<a href="{{ $repo }}" class="td-open-source-badge" target="_blank" rel="noopener noreferrer" title="Open Source Project on GitHub — Amendments and contributions welcomed">
  <span class="td-open-source-badge__icon">
    <i class="fa-brands fa-github" aria-hidden="true"></i>
  </span>
  <span class="td-open-source-badge__label">Open Source Project</span>
  <span class="td-open-source-badge__stars" data-td-github-stars aria-hidden="true">GitHub</span>
  <span class="td-open-source-badge__arrow" aria-hidden="true">→</span>
</a>

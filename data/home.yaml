faq:
  title: FAQ
  items:
  - question: Who is this book for?
    answer: Readers who know basic HTML, CSS, JavaScript, and command-line usage and want to develop broader
      front-end engineering skills. Professional front-end experience is not assumed.
    open: true
  - question: Is this a React or Vue book?
    answer: The web platform comes first. React and Vue provide comparative examples, while the book focuses
      on concepts that carry across frameworks.
  - question: How do the practicals work?
    answer: The Playground contains 18 exercise briefs. Most call for a small Vite and TypeScript project;
      follow each brief for its requirements. Runnable companion implementations are planned for a separate
      repository.
  - question: Are lecture slides available?
    answer: There are currently 18 lecture decks covering Chapters 1-18. Open a deck from Lecture slides
      to present it or use its print layout.
  - question: Where should I begin?
    answer: Start with Chapter 1 for the full progression, or choose a learning path above to revisit
      platform foundations, application architecture, or production engineering.
  - question: Can I download the book?
    answer: Yes! You can download the complete offline PDF edition or read the entire manuscript online in a single continuous view using the download section below.
principles:
  title: Engineering principles
  columns: 3
  items:
  - icon: fa-solid fa-globe
    title: Understand the platform
    desc: Use browser behavior, web standards, accessibility, and security as the foundation for framework
      decisions.
  - icon: fa-solid fa-chart-line
    title: Measure and verify
    desc: Support performance and reliability decisions with observations, tests, and production feedback.
  - icon: fa-solid fa-scale-balanced
    title: Make trade-offs explicit
    desc: Choose the simplest approach that meets the requirements, and record its costs and constraints.
